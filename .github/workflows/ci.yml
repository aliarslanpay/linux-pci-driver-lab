name: build-and-emulated-integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CACHE: /home/runner/.cache/linux-pci-driver-lab
      GUEST_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools (no host kernel module insertion)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13 make curl dpkg-dev libelf-dev qemu-system-x86 busybox-static cpio gzip
      - name: Restore checksummed guest packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/linux-pci-driver-lab/packages
          key: edu-guest-6.8.0-138-${{ hashFiles('scripts/kernel-packages.txt') }}
      - name: Bootstrap matching kernel and headers
        run: make bootstrap
      - name: Host client checks and sanitizers
        run: make host-check sanitize
      - name: Build module and run TCG guest integration
        run: make integration
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-diagnostics
          path: build/guest.log
          if-no-files-found: ignore
